spring:
  application:
    name: attend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

  jwt:
    secret : ${jWT_SECRET}
    expiration : 
      access : ${JWT_EXPIRATION_ACCESS}
      refresh: ${JWT_EXPIRATION_REFRESH}

# Auth cookies. SameSite=None is required for a cross-site frontend, but browsers only
# store such a cookie when it is also Secure, so Serve over HTTPS when secure=true.
app:
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:None}
  refresh:
    rotation-threshold: ${REFRESH_ROTATION_THRESHOLD:24h}
